[package]
name = "lazarus_vault"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/LazarusProtocol/contracts"
publish = false
description = "LazarusProtocol Decentralized State-Rent & State-Warming Escrow Vault"

[package.metadata.stellar]
cargo_inherit = true

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { version = "=2.1.1", default-features = false, features = ["alloc"] }
